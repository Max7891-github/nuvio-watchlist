name: Build addon

on:
  push:
    branches: [main]
  workflow_dispatch:        # the "Run workflow" button = instant refresh
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours, pulls your latest Notion list

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
